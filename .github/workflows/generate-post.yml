name: Generate Post

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Source URL or text'
        required: true
        type: string
      lang:
        description: 'Language (ru / en / both)'
        required: true
        default: 'ru'
        type: choice
        options:
          - ru
          - en
          - both
      user_note:
        description: 'Optional user note / context'
        required: false
        default: ''
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate post
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          LANG: ${{ github.event.inputs.lang }}
          USER_NOTE: ${{ github.event.inputs.user_note }}
        run: node scripts/generate-post.mjs

      - name: Commit & push
        run: |
          git config user.name "neversleep-bot"
          git config user.email "bot@neversleep.chat"
          git add -A
          git diff --staged --quiet || git commit -m "new post"
          git push

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          SLUG=$(ls -t src/content/posts/*/ 2>/dev/null | head -1 | xargs basename || echo "unknown")
          MSG="$([ "$STATUS" = "success" ] && echo '✅ Пост готов!' || echo '❌ Ошибка генерации')
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}&text=${MSG}&disable_web_page_preview=true"
